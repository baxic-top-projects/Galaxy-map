name: Client CI/CD

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "kafka-connect/**"
      - "docker-compose.yml"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize env files from repository secrets
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
          GATEWAY_ENV: ${{ secrets.GATEWAY_ENV }}
          STORM_ENV: ${{ secrets.STORM_ENV }}
          ASSET_ENV: ${{ secrets.ASSET_ENV }}
          CATALOG_ENV: ${{ secrets.CATALOG_ENV }}
          AUTH_ENV: ${{ secrets.AUTH_ENV }}
          KAFKA_CONNECT_ENV: ${{ secrets.KAFKA_CONNECT_ENV }}
        run: |
          printf '%s\n' "$CLIENT_ENV" > client/.env
          printf '%s\n' "$GATEWAY_ENV" > server/api-gateway/.env
          printf '%s\n' "$STORM_ENV" > server/services/storm-service/.env
          printf '%s\n' "$ASSET_ENV" > server/services/asset-service/.env
          printf '%s\n' "$CATALOG_ENV" > server/services/catalog-service/.env
          printf '%s\n' "$AUTH_ENV" > server/services/auth-service/.env
          printf '%s\n' "$KAFKA_CONNECT_ENV" > kafka-connect/.env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/client" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: ${{ github.event_name == 'workflow_dispatch' }}
          secret-files: |
            client_env=client/.env
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize env files from repository secrets
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
          GATEWAY_ENV: ${{ secrets.GATEWAY_ENV }}
          STORM_ENV: ${{ secrets.STORM_ENV }}
          ASSET_ENV: ${{ secrets.ASSET_ENV }}
          CATALOG_ENV: ${{ secrets.CATALOG_ENV }}
          AUTH_ENV: ${{ secrets.AUTH_ENV }}
          KAFKA_CONNECT_ENV: ${{ secrets.KAFKA_CONNECT_ENV }}
        run: |
          printf '%s\n' "$CLIENT_ENV" > client/.env
          printf '%s\n' "$GATEWAY_ENV" > server/api-gateway/.env
          printf '%s\n' "$STORM_ENV" > server/services/storm-service/.env
          printf '%s\n' "$ASSET_ENV" > server/services/asset-service/.env
          printf '%s\n' "$CATALOG_ENV" > server/services/catalog-service/.env
          printf '%s\n' "$AUTH_ENV" > server/services/auth-service/.env
          printf '%s\n' "$KAFKA_CONNECT_ENV" > kafka-connect/.env

      - name: Copy project to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client,server,kafka-connect,scripts,docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Build project on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script_stop: true
          command_timeout: 60m
          script: |
            bash "$DEPLOY_PATH/scripts/compose-k3s-sync.sh" \
              --project-dir "$DEPLOY_PATH"
