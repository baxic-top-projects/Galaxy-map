apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: galaxy-kafka-data
  namespace: galaxy-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: galaxy-redis-data
  namespace: galaxy-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
