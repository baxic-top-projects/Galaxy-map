# Airflow + MLflow + stormmodel on control-plane (hostPorts keep nginx localhost proxies).
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: stormmodel
  namespace: mlops
spec:
  selector:
    app: stormmodel
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: mlops
spec:
  selector:
    app: airflow-webserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp-baxic
      containers:
        - name: mlflow
          image: airflowmlflow_mlflow:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: mlops-env
          command: ["sh", "-ec"]
          args:
            - |
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "$MLFLOW_BACKEND_STORE_URI" \
                --serve-artifacts \
                --artifacts-destination "s3://${MLFLOW_ARTIFACT_BUCKET}/${MLFLOW_ARTIFACT_PREFIX}"
          ports:
            - containerPort: 5000
              hostPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormmodel
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stormmodel
  template:
    metadata:
      labels:
        app: stormmodel
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp-baxic
      containers:
        - name: stormmodel
          image: airflowmlflow_stormmodel:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: mlops-env
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
            - name: MODEL_SERVING_PORT
              value: "8000"
          command: ["/bin/sh", "/app/model-serving-entrypoint.sh"]
          ports:
            - containerPort: 8000
              hostPort: 8000
          volumeMounts:
            - name: entrypoint
              mountPath: /app/model-serving-entrypoint.sh
              subPath: model-serving-entrypoint.sh
            - name: model-env
              mountPath: /root/.mlflow
      volumes:
        - name: entrypoint
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/scripts
            type: Directory
        - name: model-env
          hostPath:
            path: /var/snap/docker/common/var-lib-docker/volumes/airflowmlflow_model-environments/_data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp-baxic
      securityContext:
        fsGroup: 0
      containers:
        - name: webserver
          image: airflowmlflow_airflow-webserver:latest
          imagePullPolicy: Never
          command: ["airflow", "webserver"]
          envFrom:
            - secretRef:
                name: mlops-env
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX
              value: "true"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
          ports:
            - containerPort: 8080
              hostPort: 8080
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
            - name: data
              mountPath: /opt/airflow/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: dags
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/dags
            type: Directory
        - name: logs
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/logs
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp-baxic
      securityContext:
        fsGroup: 0
      containers:
        - name: scheduler
          image: airflowmlflow_airflow-scheduler:latest
          imagePullPolicy: Never
          command: ["airflow", "scheduler"]
          envFrom:
            - secretRef:
                name: mlops-env
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
            - name: data
              mountPath: /opt/airflow/data
      volumes:
        - name: dags
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/dags
            type: Directory
        - name: logs
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/logs
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /home/baxic/Documents/GitHub/AirflowMlflow/data
            type: DirectoryOrCreate
