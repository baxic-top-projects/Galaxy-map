apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: galaxy
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: galaxy
spec:
  selector:
    app: auth-service
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: asset-service
  namespace: galaxy
spec:
  selector:
    app: asset-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: storm-service
  namespace: galaxy
spec:
  selector:
    app: storm-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: galaxy
spec:
  selector:
    app: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: galaxy
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: galaxy
spec:
  selector:
    app: client
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: catalog
          image: galaxy-map-catalog-service:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-catalog-env
                optional: true
          env:
            - name: CATALOG_REDIS_URL
              value: redis://redis:6379/0
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: auth
          image: galaxy-map-auth-service:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-auth-env
                optional: true
          env:
            - name: AUTH_SMTP_HOST
              value: smtp-service-galaxy
            - name: AUTH_SMTP_PORT
              value: "1025"
          ports:
            - containerPort: 8004
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-service
  template:
    metadata:
      labels:
        app: asset-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: asset
          image: galaxy-map-asset-service:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-asset-env
                optional: true
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storm-service
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storm-service
  template:
    metadata:
      labels:
        app: storm-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: storm
          image: galaxy-map-storm-service:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-storm-env
                optional: true
          env:
            - name: STORM_CATALOG_SERVICE_URL
              value: http://catalog-service:8003
            - name: STORM_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: connect
          image: galaxy-map-kafka-connect:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-kafka-connect-env
                optional: true
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: kafka-connect
            - name: CONNECT_GROUP_ID
              value: galaxy-s3-connect
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: _galaxy_connect_configs
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: _galaxy_connect_offsets
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: _galaxy_connect_status
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          ports:
            - containerPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: gateway
          image: galaxy-map-api-gateway:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: galaxy-gateway-env
                optional: true
          ports:
            - containerPort: 8000
              hostPort: 9998
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: client
          image: galaxy-map-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              hostPort: 9999
