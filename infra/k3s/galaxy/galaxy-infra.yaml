apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: galaxy
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: galaxy
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: smtp-service-galaxy
  namespace: galaxy
spec:
  selector:
    app: smtp-service-galaxy
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 1080
      targetPort: 1080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /tmp/kraft-combined-logs
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          ports:
            - containerPort: 9092
            - containerPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-service-galaxy
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-service-galaxy
  template:
    metadata:
      labels:
        app: smtp-service-galaxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-146
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
        searches:
          - galaxy-map.svc.cluster.local
          - galaxy.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: maildev
          image: maildev/maildev:3.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: galaxy-auth-env
                optional: true
          command: ["/bin/sh", "-c"]
          args:
            - 'exec node dist/bin/maildev.js --outgoing-host "${SMTP_OUTGOING_HOST}" --outgoing-port "${SMTP_OUTGOING_PORT}" --outgoing-secure --outgoing-user "${SMTP_OUTGOING_USER}" --outgoing-pass "${SMTP_OUTGOING_PASSWORD}" --auto-relay --verbose'
          ports:
            - containerPort: 1025
            - containerPort: 1080
              hostPort: 9997
