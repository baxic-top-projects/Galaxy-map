services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      secrets:
        - client_env
    ports:
      - "9999:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - galaxy_net

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: galaxy-api-gateway
    ports:
      - "9998:8000"
    env_file:
      - ./server/api-gateway/.env
    depends_on:
      storm-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - galaxy_net

  storm-service:
    build:
      context: ./server/services/storm-service
      dockerfile: Dockerfile
    container_name: galaxy-storm-service
    expose:
      - "8001"
    env_file:
      - ./server/services/storm-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - galaxy_net

  asset-service:
    build:
      context: ./server/services/asset-service
      dockerfile: Dockerfile
    container_name: galaxy-asset-service
    expose:
      - "8002"
    env_file:
      - ./server/services/asset-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - galaxy_net

  catalog-service:
    build:
      context: ./server/services/catalog-service
      dockerfile: Dockerfile
    container_name: galaxy-catalog-service
    expose:
      - "8003"
    env_file:
      - ./server/services/catalog-service/.env
    environment:
      CATALOG_REDIS_URL: redis://redis:6379/0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - galaxy_net

  auth-service:
    build:
      context: ./server/services/auth-service
      dockerfile: Dockerfile
    container_name: galaxy-auth-service
    expose:
      - "8004"
    env_file:
      - path: ./server/services/auth-service/.env
        required: false
    environment:
      AUTH_SMTP_HOST: smtp-service-galaxy
      AUTH_SMTP_PORT: 1025
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      smtp-service-galaxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - galaxy_net

  smtp-service-galaxy:
    image: maildev/maildev
    container_name: smtp-service-galaxy
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--no-warnings=DeprecationWarning
      - DEBUG=maildev*
    env_file:
      - path: ./server/services/auth-service/.env
        required: false
    entrypoint:
      - /bin/sh
    command:
      - -c
      - 'exec node dist/bin/maildev.js --outgoing-host "$${SMTP_OUTGOING_HOST}" --outgoing-port "$${SMTP_OUTGOING_PORT}" --outgoing-secure --outgoing-user "$${SMTP_OUTGOING_USER}" --outgoing-pass "$${SMTP_OUTGOING_PASSWORD}" --auto-relay --verbose'
    ports:
      - "9997:1080"
    networks:
      - galaxy_net

  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    expose:
      - "6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - galaxy_net

  kafka:
    image: apache/kafka:3.9.0
    container_name: galaxy-kafka
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - galaxy_net

secrets:
  client_env:
    file: ./client/.env

networks:
  galaxy_net:
    driver: bridge
