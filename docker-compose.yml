services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      secrets:
        - client_env
    ports:
      - "9999:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - galaxy_net

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: galaxy-api-gateway
    ports:
      - "9998:8000"
    env_file:
      - ./server/api-gateway/.env
    depends_on:
      storm-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - galaxy_net

  storm-service:
    build:
      context: ./server/services/storm-service
      dockerfile: Dockerfile
    container_name: galaxy-storm-service
    expose:
      - "8001"
    env_file:
      - ./server/services/storm-service/.env
    volumes:
      - ./client/public/data/galaxy-index.json:/data/galaxy-index.json:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - galaxy_net

  kafka:
    image: apache/kafka:3.9.0
    container_name: galaxy-kafka
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - galaxy_net

secrets:
  client_env:
    file: ./client/.env

networks:
  galaxy_net:
    driver: bridge
